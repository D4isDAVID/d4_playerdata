name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: d4_playerdata

      - name: Checkout fivem-lls-addon
        uses: actions/checkout@v7
        with:
          repository: overextended/fivem-lls-addon
          path: fivem-lls-addon
          sparse-checkout: |
            library
          sparse-checkout-cone-mode: false

      - name: Lint
        uses: PocusSoftware/lint-luals@v1
        with:
          check: d4_playerdata
          configpath: .luarc.ci.json
          fail_on_warnings: true
