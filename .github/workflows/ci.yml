name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: ${{ github.event.repository.name }}

      - name: Checkout fivem-lls-addon
        uses: actions/checkout@v7
        with:
          repository: overextended/fivem-lls-addon
          path: fivem-lls-addon

      - name: Lint
        uses: PocusSoftware/lint-luals@v1
        env:
          CFX_LUALS_ADDON: ${{ github.workspace }}/fivem-lls-addon
        with:
          check: ${{ github.event.repository.name }}
          fail_on_warnings: true
